# Official WooSignal App Template for Shopify

# ShopMax
# Version: 2.0.0
# Author: Anthony Gordon
# Homepage: https://woosignal.com
# Documentation: https://woosignal.com/docs/app/shopmax

### Change App Icon
# 1 Replace: public/assets/icon/appicon.png (1024px1024px icon size)
# 2 Run this command from the terminal: "dart run flutter_launcher_icons:main"

### Uploading the IOS/Android app
# IOS https://flutter.dev/docs/deployment/ios
# Android https://flutter.dev/docs/deployment/android

name: flutter_app
description: A new Nylo Flutter application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0 <4.0.0"

dependencies:
  google_fonts: ^6.2.1
  analyzer: ^6.7.0
  intl: ^0.19.0
  nylo_framework: ^6.5.2
  pretty_dio_logger: ^1.4.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  flutter_local_notifications: ^18.0.1
  font_awesome_flutter: ^10.8.0
  scaffold_ui: ^1.1.8
  cached_network_image: ^3.4.1
  package_info_plus: ^4.2.0
  money_formatter: ^0.0.5
  pull_to_refresh_flutter3: 2.0.2
  url_launcher: ^6.3.0
  bubble_tab_indicator: ^0.1.6
  validated: ^2.0.0
  flutter_spinkit: ^5.2.1
  auto_size_text: ^3.0.0
  flutter_inappwebview: ^6.1.5
  html: ^0.15.4
  woosignal_shopify_api: ^2.2.0
  flutter_widget_from_html_core: ^0.15.2
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_swiper_view: ^1.1.8
  firebase_messaging: ^15.1.5
  firebase_core: ^3.9.0
  collection: ^1.17.1
  flutter_stripe: ^11.3.0
  razorpay_flutter: ^1.3.7
  animate_do: ^3.3.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dependency_overrides:
    nylo_support:
      path: /Users/anthony/StudioProjects/support

dev_dependencies:
  rename: ^3.0.2
  flutter_launcher_icons: ^0.14.2
  # The following line 'flutter_lints' activates a set of recommended lints for Flutter apps,
  # packages, and plugins designed to encourage good coding practices.
#  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# APP ICON - public/app_icon/icon.png
# Build icons: "dart run flutter_launcher_icons"
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "public/app_icon/woogym-app-icon.png"
  remove_alpha_ios: true

# RENAME YOUR PROJECT
# flutter pub run rename setAppName --targets ios,android --value "YourAppName"

#dependency_overrides:
#  nylo_support:
#    path: /Users/anthony/StudioProjects/support

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - public/fonts/
    - public/images/
    - public/app_icon/
    - lang/
    - .env
